name: Deploy Resume to GitHub Pages

on:
  push:
    branches:
      - features/new-template-v1

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare static publish directory
        run: |
          rm -rf _site
          mkdir -p _site/css _site/js _site/assets
          cp index.html robots.txt sitemap.xml _site/
          cp css/style.css _site/css/
          cp js/data.js js/app.js _site/js/
          cp assets/avatar.jpg assets/favicon.svg assets/avatar.svg _site/assets/
          # Sanity check — fail if required files missing
          test -f _site/index.html
          test -f _site/js/app.js
          test -f _site/assets/avatar.jpg
          echo "Publish package:"
          find _site -type f | sort

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
